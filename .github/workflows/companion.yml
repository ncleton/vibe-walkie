name: Windows and Linux companions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Companion/**'
      - 'ProtocolFixtures/**'
      - '.github/workflows/companion.yml'

permissions:
  contents: read

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Companion/tests/Dockerfile -t vibewalkie-companion-test .
      - run: docker run --rm --init vibewalkie-companion-test
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install through the shipped Windows installer
        run: |
          & ./Companion/scripts/install-windows.ps1 -Python (Get-Command python).Source
          & "$env:LOCALAPPDATA/VibeWalkie/runtime/Scripts/python.exe" -m pip install 'pytest==9.1.1'
      - name: Require real interactive Win32 control
        run: '& "$env:LOCALAPPDATA/VibeWalkie/runtime/Scripts/python.exe" -m pytest -v -o faulthandler_timeout=45 --basetemp="${{ runner.temp }}/vibewalkie-tests" Companion/tests/test_protocol.py Companion/tests/test_windows_integration.py'
      - name: Preserve real Windows screen evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop-evidence
          path: ${{ runner.temp }}/vibewalkie-tests/**/windows-live-screen.png
          if-no-files-found: warn
