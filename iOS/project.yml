name: AppRemoteiOS
options:
  bundleIdPrefix: com.nicolascleton
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  RemoteCore:
    path: ../Packages/RemoteCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "202609031317"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 99QF92KRR7
    VIBE_WALKIE_IOS_BUNDLE_IDENTIFIER: app.vibewalkie
    VIBE_WALKIE_CONTROLS_BUNDLE_IDENTIFIER: app.vibewalkie.controls
    VIBE_WALKIE_IOS_TESTS_BUNDLE_IDENTIFIER: app.vibewalkie.tests
  configs:
    Debug:
      NOMAD_MODE_ENABLED: YES
    Release:
      NOMAD_MODE_ENABLED: YES

targets:
  AppRemoteControls:
    type: app-extension
    platform: iOS
    sources:
      - path: AppRemoteControls
      - path: SharedIntents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(VIBE_WALKIE_CONTROLS_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: Vibe Walkie Controls
        PRODUCT_MODULE_NAME: VibeWalkieControls
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AppRemoteControls/Info.plist

  AppRemoteiOS:
    type: application
    platform: iOS
    sources:
      - path: AppRemoteiOS
      - path: SharedIntents
      - path: ../Localization/locale-manifest.json
        buildPhase: resources
    dependencies:
      - package: RemoteCore
      - target: AppRemoteControls
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(VIBE_WALKIE_IOS_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: Vibe Walkie
        PRODUCT_MODULE_NAME: VibeWalkieiOS
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: VibeWalkieAppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AppRemoteiOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppRemoteiOS/AppRemoteiOS.entitlements

  AppRemoteiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AppRemoteiOSTests
    dependencies:
      - target: AppRemoteiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(VIBE_WALKIE_IOS_TESTS_BUNDLE_IDENTIFIER)"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vibe Walkie.app/Vibe Walkie"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AppRemoteiOS:
    build:
      targets:
        AppRemoteiOS: all
    test:
      targets:
        - AppRemoteiOSTests
